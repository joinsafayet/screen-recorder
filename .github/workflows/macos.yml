name: macOS build and media checks

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'CONTRIBUTING.md', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'CONTRIBUTING.md', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Apple Silicon build and media verification
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: zsh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          swift --version
          uname -m
      - name: Functional and generated-media checks
        run: |
          set -euo pipefail
          mkdir -p build
          scripts/verify.sh 2>&1 | tee build/verification.log
      - name: Build and package
        run: scripts/build.sh
      - name: Validate distribution
        run: |
          codesign --verify --deep --strict build/Prism.app
          plutil -lint build/Prism.app/Contents/Info.plist
          file build/Prism.app/Contents/MacOS/Prism
          cd build
          shasum -a 256 -c SHA256SUMS.txt
      - name: Save app and verification output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Prism-macOS-${{ github.sha }}
          path: |
            build/Prism-macOS.zip
            build/SHA256SUMS.txt
            build/verification.log
          if-no-files-found: warn
          retention-days: 7
