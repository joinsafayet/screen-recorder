name: Feature request
description: Propose a useful improvement to capture, editing, or design.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow or problem
      description: Describe what you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Design references or alternatives
